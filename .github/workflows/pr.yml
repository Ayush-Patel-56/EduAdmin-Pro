name: PR

# Pull requests run the PR's own code, so this workflow gets no secrets and a
# read-only token. Nothing here deploys. The repository is public: keep it so.
on: pull_request

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 22 is required: the API tests crash a vitest worker on Node 20.
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pipeline/go.mod
          cache: false

      # Runs `prisma generate` (postinstall). That needs no database.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the pipeline as a binary, not through `go run`: `go run` does not
      # pass SIGTERM on to the program, and a cancelled run must reach it.
      - name: Build the pipeline
        run: go -C tools/pipeline build -o "$RUNNER_TEMP/pipeline" .

      - name: Check
        run: '"$RUNNER_TEMP/pipeline" check'

  e2e:
    name: API e2e (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database: never point CI at a real one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pipeline/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the pipeline as a binary, not through `go run`: `go run` does not
      # pass SIGTERM on to the program, and a cancelled run must reach it.
      - name: Build the pipeline
        run: go -C tools/pipeline build -o "$RUNNER_TEMP/pipeline" .

      # Replays every migration from an empty database, runs the e2e suite and
      # checks the migrations match schema.prisma.
      - name: E2E
        run: '"$RUNNER_TEMP/pipeline" e2e'
