name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 22 is required: the API tests crash a vitest worker on Node 20.
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Runs `prisma generate` (postinstall). That needs no database, and
      # prisma.config.ts loads without DIRECT_URL.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter web exec tsc -b

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: |
          pnpm --filter api test
          pnpm --filter web test

      - name: Build
        run: pnpm build

  e2e:
    name: API e2e (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database: never point CI at a real one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Replays every migration from an empty database, which also catches a
      # migration that only works on top of existing data.
      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: E2E tests
        run: pnpm --filter api test:e2e
