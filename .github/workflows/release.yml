name: Release

# A push to main checks the merged commit again and, only if that is green,
# ships it to production. Only the release job's Release step sees the
# `production` environment's secrets. Never pass --allow-local here: the
# pipeline refuses to release unless GITHUB_REF is refs/heads/main.
on:
  push:
    branches: [main]

# One release at a time. A release is never cancelled part-way, between
# migrating the database and deploying.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pipeline/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the pipeline as a binary, not through `go run`: `go run` does not
      # pass SIGTERM on to the program, and a cancelled run must reach it.
      - name: Build the pipeline
        run: go -C tools/pipeline build -o "$RUNNER_TEMP/pipeline" .

      - name: Check
        run: '"$RUNNER_TEMP/pipeline" check'

  e2e:
    name: API e2e (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database: never point CI at a real one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pipeline/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the pipeline as a binary, not through `go run`: `go run` does not
      # pass SIGTERM on to the program, and a cancelled run must reach it.
      - name: Build the pipeline
        run: go -C tools/pipeline build -o "$RUNNER_TEMP/pipeline" .

      - name: E2E
        run: '"$RUNNER_TEMP/pipeline" e2e'

  release:
    name: Release to production
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pipeline/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run the pipeline as a binary, not through `go run`: `go run` does not
      # pass SIGTERM on to the program, and a cancelled run must reach it.
      - name: Build the pipeline
        run: go -C tools/pipeline build -o "$RUNNER_TEMP/pipeline" .

      - name: Release
        run: '"$RUNNER_TEMP/pipeline" release'
        # The production secrets go to this step only, not the job, so no other
        # step (an install script, an action) sees them. The pipeline passes each
        # child process only the secrets that command needs.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          PROD_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
          PROD_MAIL_FROM: ${{ secrets.PROD_MAIL_FROM }}
          PROD_R2_ACCOUNT_ID: ${{ secrets.PROD_R2_ACCOUNT_ID }}
          PROD_R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          PROD_R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Optional, not secrets. TRUST_PROXY is the proxy hop count (empty
          # means the default, 1); DIGEST_ENABLED=false stops the digest emails
          # (empty means true).
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
